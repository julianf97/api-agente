name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres-ci-password
      DB_NAME: postgres
      DB_SCHEMA: api-agente
      DB_TEST_SCHEMA: api-agente-test
      DB_USE_TEST_SCHEMA: "false"
      JWT_SECRET: ci-test-secret-only-not-used-outside-this-job

    steps:
      - name: Obtener el código
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Crear esquemas y tablas
        run: node scripts/bootstrap-db.js

      - name: Ejecutar todos los tests
        run: npm test